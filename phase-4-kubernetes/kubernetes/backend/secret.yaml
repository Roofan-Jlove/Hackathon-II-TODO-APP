apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: todoapp
  labels:
    app: todo-backend
    tier: backend
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values with your actual secrets
  # DO NOT commit actual secrets to git!
  # Use: kubectl create secret generic backend-secrets --from-literal=...
  DATABASE_URL: "postgresql+asyncpg://user:password@host.neon.tech/dbname?ssl=require"
  OPENAI_API_KEY: "sk-proj-your-openai-api-key-here"
  BETTER_AUTH_SECRET: "your-better-auth-secret-here-min-32-chars"
  JWT_SECRET: "your-jwt-secret-here-min-32-chars"
